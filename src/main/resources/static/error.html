<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Not Found</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }

        h1 {
            color: #dc3545;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background: #0056b3;
        }

        .code {
            font-size: 14px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>404 - URL Not Found</h1>

    <p>
        The short URL you are trying to access does not exist or has been removed.
    </p>

    <a href="/" class="btn">Go Home</a>

    <div class="code">
        Check the link and try again
    </div>
</div>

</body>
</html>
