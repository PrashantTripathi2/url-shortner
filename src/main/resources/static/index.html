<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            margin-top: 100px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 500px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
        }

        .copy-btn {
            margin-left: 10px;
            background: green;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>URL Shortener</h1>

    <input
            type="text"
            id="urlInput"
            placeholder="Enter long URL"
    >

    <button onclick="shortenURL()">Shorten</button>

    <div class="result" id="result"></div>
</div>

<script>

    async function shortenURL() {

        const url = document.getElementById("urlInput").value;

        if (!url) {
            alert("Please enter a URL");
            return;
        }

        const response = await fetch("/short-url", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                url: url
            })
        });

        const data = await response.json();

        const shortURL =
            window.location.origin + "/r/" + data.shortURL;

        document.getElementById("result").innerHTML = `
            <input type="text" id="shortUrlText" value="${shortURL}" readonly />

            <button class="copy-btn" onclick="copyURL()">
                Copy
            </button>
        `;
    }

    function copyURL() {

        const copyText =
            document.getElementById("shortUrlText");

        copyText.select();
        copyText.setSelectionRange(0, 99999);

        navigator.clipboard.writeText(copyText.value);

        alert("Copied: " + copyText.value);
    }

</script>

</body>
</html>
